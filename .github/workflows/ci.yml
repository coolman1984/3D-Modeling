name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @space-planner/editor exec playwright install --with-deps chromium
      - run: pnpm --filter @space-planner/server build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-screenshots
          path: |
            apps/editor/e2e-results/
            apps/editor/test-results/
          if-no-files-found: ignore
